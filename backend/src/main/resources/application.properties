spring.application.name=shopstack-backend
server.port=8080

# H2 in-memory database (swap for PostgreSQL in production - see README)
# PostgreSQL (persistent) \u2014 replace YOUR_POSTGRES_PASSWORD with the password you set during install
spring.datasource.url=jdbc:postgresql://localhost:5432/shopstack
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=mayur

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# H2 console for inspecting seeded data during development
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

